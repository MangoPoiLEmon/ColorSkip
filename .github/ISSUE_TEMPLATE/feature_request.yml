name: Feature request
description: 建议新功能、规则或适配改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景，而不是只给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: constraints
    attributes:
      label: 项目约束
      options:
        - label: 方案不依赖 INTERNET 权限、Root 或 shell
          required: true
