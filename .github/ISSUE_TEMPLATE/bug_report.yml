name: Bug report
description: 报告无法跳过、误点或崩溃
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。日志和快照请先脱敏，不要粘贴邮箱、账号、聊天内容或验证码。
  - type: input
    id: version
    attributes:
      label: ColorSkip 版本
      description: 例如 1.0.2 (versionCode 3)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 型号 + ColorOS/Android 版本，例如 OnePlus 13 / ColorOS 17 / Android 17
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 目标应用与包名
      description: 例如 Outlook / com.microsoft.office.outlook
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 进入 ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 快照
      description: 可粘贴导出日志或节点快照；请先删除个人信息。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除日志/快照中的个人信息
          required: true
        - label: 这不是一个安全漏洞（安全漏洞请用 Security Advisory 私密报告）
          required: true
